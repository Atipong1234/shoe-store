<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - จัดการสินค้า</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">👟 SHOE STORE - Admin</div>
    <div>
      <span id="who" style="margin-right:14px;"></span>
      <button id="logout-btn" class="admin-btn">ออกจากระบบ</button>
    </div>
  </header>

  <div class="dash-wrap">
    <div class="dash-section">
      <h2 id="form-title">เพิ่มสินค้าใหม่</h2>
      <p id="error" class="error-msg" style="display:none;"></p>
      <form id="product-form">
        <input type="hidden" id="product-id">
        <div class="field">
          <label>ชื่อสินค้า</label>
          <input type="text" id="name" required>
        </div>
        <div class="field">
          <label>แบรนด์</label>
          <input type="text" id="brand">
        </div>
        <div class="field">
          <label>ราคา (บาท)</label>
          <input type="number" id="price" min="0" step="0.01" required>
        </div>
        <div class="field">
          <label>จำนวนคงเหลือ</label>
          <input type="number" id="stock" min="0" value="0">
        </div>
        <div class="field">
          <label>รายละเอียดสินค้า</label>
          <textarea id="description"></textarea>
        </div>
        <div class="field">
          <label>รูปภาพสินค้า (เลือกได้หลายรูป)</label>
          <input type="file" id="images" accept="image/*" multiple>
          <div id="preview" class="preview-imgs"></div>
        </div>
        <button type="submit" class="btn">บันทึกสินค้า</button>
        <button type="button" id="cancel-edit" class="btn btn-secondary" style="display:none;">ยกเลิกแก้ไข</button>
      </form>
    </div>

    <div class="dash-section">
      <h2>รายการสินค้าทั้งหมด</h2>
      <table>
        <thead>
          <tr><th>รูป</th><th>ชื่อ</th><th>แบรนด์</th><th>ราคา</th><th>คงเหลือ</th><th>จัดการ</th></tr>
        </thead>
        <tbody id="product-table-body"></tbody>
      </table>
    </div>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
